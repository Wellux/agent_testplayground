[project]
name = "ralph-harness"
version = "0.1.0"
description = "A/B + embeddings + ingest + compress CLI for the Ralph meta-chain."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
harness = "harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
target-version = "py311"
line-length = 100
