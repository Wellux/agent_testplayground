[project]
name = "ralph-voice-server"
version = "0.1.0"
description = "Mac mini voice + dispatch endpoint for the Ralph meta-chain."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.20",
]

[project.scripts]
ralph-voice = "voice_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_server"]
