[project]
name = "ralph-mcp-server"
version = "0.1.0"
description = "Stdio MCP server exposing the Ralph harness CLI to Claude Code."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ralph-mcp-server = "ralph_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ralph_mcp_server.py"]
